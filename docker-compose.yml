services:
  postgres:
    image: postgres:16
    container_name: iot-postgres
    environment:
      POSTGRES_DB: iot_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d iot_platform" ]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./init.sql:/init.sql:ro
    entrypoint: [ "psql" ]
    command:
      - "-h"
      - "postgres"
      - "-U"
      - "postgres"
      - "-d"
      - "iot_platform"
      - "-v"
      - "ON_ERROR_STOP=1"
      - "-f"
      - "/init.sql"

volumes:
  postgres_data:
